global:
  scrape_interval: 5s

# dns_sd_configs discovers every replica of a compose service.
scrape_configs:
  - job_name: api
    dns_sd_configs: [{ names: [api], type: A, port: 3000 }]
  - job_name: worker
    dns_sd_configs: [{ names: [worker], type: A, port: 9100 }]
  - job_name: scheduler
    dns_sd_configs: [{ names: [scheduler], type: A, port: 9101 }]
  - job_name: tracker-api
    dns_sd_configs: [{ names: [tracker-api], type: A, port: 3001 }]
