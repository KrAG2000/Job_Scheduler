events {}

http {
  # Docker's DNS returns one A record per replica; re-resolve so scaling is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone api 64k;
    server api:3000 resolve;
  }
  upstream tracker {
    zone tracker 64k;
    server tracker-api:3001 resolve;
  }

  server {
    listen 80;
    client_max_body_size 1m;

    # Metrics are scraped internally by Prometheus, never exposed publicly.
    location = /metrics { return 404; }

    location /track {
      proxy_pass http://tracker;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://api;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
