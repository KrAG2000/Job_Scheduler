# Full stack:   docker compose up -d --build
# Infra only:   docker compose up -d redis postgres   (then run services with npm start)
# Redis HA:     docker compose -f docker-compose.yml -f docker-compose.ha.yml up -d --build

x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: ${DB_USER:-user}
    DB_PASSWORD: ${DB_PASSWORD:-password}
    DB_NAME: ${DB_NAME:-scheduler}
    API_KEYS: ${API_KEYS:-}
    RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-200}
    RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-100}
    MAX_QUEUE_BACKLOG: ${MAX_QUEUE_BACKLOG:-100000}
    PG_POOL_MAX: ${PG_POOL_MAX:-10}
    TRUST_PROXY: "1"
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    # appendfsync everysec: at most ~1s of acknowledged writes can be lost on a crash.
    # Postgres (source of truth) + the sweeper recover anything lost.
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    # Room for many worker replicas x PG_POOL_MAX connections each.
    command: postgres -c max_connections=${PG_MAX_CONNECTIONS:-300}
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-scheduler}
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["node", "apps/api/src/server.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: api
      API_PORT: "3000"
    deploy:
      replicas: ${API_REPLICAS:-2}

  worker:
    <<: *app
    command: ["node", "apps/worker/src/worker.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
      METRICS_PORT: "9100"
    stop_grace_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:-3}

  scheduler:
    <<: *app
    command: ["node", "apps/scheduler/src/scheduler.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: scheduler
      METRICS_PORT: "9101"
    deploy:
      replicas: ${SCHEDULER_REPLICAS:-2}

  tracker-api:
    <<: *app
    command: ["node", "apps/tracker-api/src/server.js"]
    environment:
      <<: *app-env
      SERVICE_NAME: tracker-api
      TRACKER_PORT: "3001"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - api
      - tracker-api

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
